[project]
name = "hy-surveyagent"
version = "0.1.0"
description = "基于 Hy3 的多阶段学术 Survey 生成 Agent Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "markdown-it-py>=3,<5",
    "pyyaml>=6.0",
    "uvicorn>=0.30,<1",
]

[project.scripts]
hy-surveyagent = "app.main:main"
hy-surveyagent-web = "app.web.server:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".codebuddy", "runs", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
